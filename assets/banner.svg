<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Zen Essentials Compact">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <style>
      .t   { font-family:'Segoe UI',Ubuntu,system-ui,sans-serif; fill:#ffffff; }
      .sub { font-family:'Segoe UI',Ubuntu,system-ui,sans-serif; fill:#CCFBF1; }
      .lbl { font-family:'Segoe UI',Ubuntu,system-ui,sans-serif; fill:#E0F2FE; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="340" rx="28" fill="url(#bg)"/>

  <!-- BEFORE: spread out big tiles -->
  <g transform="translate(70,84)">
    <text class="lbl" x="70" y="-14" font-size="15" text-anchor="middle" opacity="0.85">Before</text>
    <g fill="#ffffff" fill-opacity="0.14">
      <rect x="0"  y="0"  width="60" height="60" rx="14"/>
      <rect x="80" y="0"  width="60" height="60" rx="14"/>
      <rect x="0"  y="80" width="60" height="60" rx="14"/>
      <rect x="80" y="80" width="60" height="60" rx="14"/>
    </g>
    <g fill="#5EEAD4">
      <circle cx="30"  cy="30"  r="9"/>
      <circle cx="110" cy="30"  r="9"/>
      <circle cx="30"  cy="110" r="9"/>
      <circle cx="110" cy="110" r="9"/>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(240,154)">
    <path d="M0 0 H70" stroke="#A7F3D0" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M70 0 l-18 -10 v20 z" fill="#A7F3D0"/>
  </g>

  <!-- AFTER: compact tiles, more per row -->
  <g transform="translate(330,84)">
    <text class="lbl" x="80" y="-14" font-size="15" text-anchor="middle" opacity="0.95">After</text>
    <g fill="#ffffff" fill-opacity="0.20">
      <rect x="0"   y="0"  width="34" height="34" rx="9"/>
      <rect x="42"  y="0"  width="34" height="34" rx="9"/>
      <rect x="84"  y="0"  width="34" height="34" rx="9"/>
      <rect x="126" y="0"  width="34" height="34" rx="9"/>
      <rect x="0"   y="42" width="34" height="34" rx="9"/>
      <rect x="42"  y="42" width="34" height="34" rx="9"/>
      <rect x="84"  y="42" width="34" height="34" rx="9"/>
      <rect x="126" y="42" width="34" height="34" rx="9"/>
    </g>
    <g fill="#99F6E4">
      <circle cx="17"  cy="17" r="8"/><circle cx="59"  cy="17" r="8"/>
      <circle cx="101" cy="17" r="8"/><circle cx="143" cy="17" r="8"/>
      <circle cx="17"  cy="59" r="8"/><circle cx="59"  cy="59" r="8"/>
      <circle cx="101" cy="59" r="8"/><circle cx="143" cy="59" r="8"/>
    </g>
  </g>

  <!-- title block -->
  <text class="t"   x="560" y="150" font-size="48" font-weight="700">Zen Essentials Compact</text>
  <text class="sub" x="562" y="192" font-size="21">Square Essentials tiles that fill the sidebar width</text>
  <text class="sub" x="562" y="220" font-size="21">and reflow as you resize it.</text>
  <g transform="translate(562,244)" font-size="14">
    <rect width="118" height="30" rx="15" fill="#ffffff" fill-opacity="0.16"/>
    <text class="lbl" x="59" y="20" text-anchor="middle">Zen Browser</text>
    <rect x="130" width="70" height="30" rx="15" fill="#ffffff" fill-opacity="0.16"/>
    <text class="lbl" x="165" y="20" text-anchor="middle">Sine</text>
    <rect x="210" width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.16"/>
    <text class="lbl" x="258" y="20" text-anchor="middle">CSS only</text>
  </g>
</svg>
